# Fork-only research. This file must not be copied to upstream or production.
# The checked-out upstream source is READ ONLY and pinned for reproducibility.
name: Fork-only EMHASS Python 3.15 qualification

on:
  push:
    branches:
      - research/python315-qualification-20261111
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"
  QUALIFICATION_SOURCE_SHA: 26385683ad7feb017597d2e306af2a6f6d8e99e7

jobs:
  dependency-wheels:
    name: Wheel resolution / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-amd64, os: ubuntu-24.04 }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
          - { label: windows-amd64, os: windows-latest }
          - { label: macos-runner, os: macos-latest }
    steps:
      - name: Checkout pinned source without a push credential
        uses: actions/checkout@v4
        with:
          repository: davidusb-geek/emhass
          ref: ${{ env.QUALIFICATION_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Binary-only resolve of production and test dependencies
        shell: bash
        run: |
          set +e
          {
            echo "Source SHA: $QUALIFICATION_SOURCE_SHA"
            echo "Runner OS: $RUNNER_OS"
            echo "Architecture: $(uname -m)"
            uv --version
          } > environment.txt
          uv pip compile pyproject.toml --python-version 3.15 --extra test --only-binary :all: --output-file python315-wheel-requirements.txt > python315-wheel-resolve.log 2>&1
          rc=$?
          echo "$rc" > wheel-resolve-exit-code.txt
          echo "Binary-only resolution exit code: $rc" >> environment.txt
          cat environment.txt
          tail -n 90 python315-wheel-resolve.log
          exit 0
      - name: Upload wheel and resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python315-wheels-${{ matrix.label }}
          path: |
            environment.txt
            python315-wheel-requirements.txt
            python315-wheel-resolve.log
            wheel-resolve-exit-code.txt
          if-no-files-found: warn
      - name: Mark unresolved wheel requirements
        shell: bash
        run: test "$(cat wheel-resolve-exit-code.txt)" -eq 0

  linux-full-regression:
    name: Python 3.15.2 full suite / Linux AMD64
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout pinned source without a push credential
        uses: actions/checkout@v4
        with:
          repository: davidusb-geek/emhass
          ref: ${{ env.QUALIFICATION_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install native build prerequisites for source-only numerical packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libhdf5-dev pkg-config libopenblas-dev liblapack-dev \
            libblosc-dev liblz4-dev libbz2-dev libzstd-dev
      - name: Install isolated Python 3.15.2
        run: uv python install 3.15.2
      - name: Resolve/install full test environment and run full regression suite
        shell: bash
        run: |
          set +e
          echo "Source SHA: $QUALIFICATION_SOURCE_SHA" > qualification-environment.txt
          uv --version >> qualification-environment.txt
          uv python list --only-installed >> qualification-environment.txt
          uv sync --python 3.15.2 --reinstall --upgrade --extra test > python315-sync.log 2>&1
          sync_rc=$?
          echo "$sync_rc" > sync-exit-code.txt
          echo "Environment sync exit code: $sync_rc" >> qualification-environment.txt
          if [ "$sync_rc" -eq 0 ]; then
            uv run --python 3.15.2 python --version >> qualification-environment.txt 2>&1
            uv pip list --python .venv/bin/python --format json > python315-resolved-packages.json 2> python315-package-list.log
            uv run --python 3.15.2 pytest -q > python315-pytest.log 2>&1
            echo "$?" > pytest-exit-code.txt
          else
            echo "NOT RUN: sync failed" > python315-pytest.log
            echo "99" > pytest-exit-code.txt
          fi
          cat qualification-environment.txt
          tail -n 90 python315-sync.log
          tail -n 90 python315-pytest.log
          exit 0
      - name: Upload install, package and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python315-linux-full-regression
          path: |
            qualification-environment.txt
            python315-sync.log
            python315-package-list.log
            python315-resolved-packages.json
            python315-pytest.log
            sync-exit-code.txt
            pytest-exit-code.txt
          if-no-files-found: warn
      - name: Mark qualification failure when sync or tests fail
        shell: bash
        run: |
          test "$(cat sync-exit-code.txt)" -eq 0
          test "$(cat pytest-exit-code.txt)" -eq 0

  package-attribution-linux:
    name: Per-package Python 3.15 wheel attribution / Linux AMD64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout pinned source without a push credential
        uses: actions/checkout@v4
        with:
          repository: davidusb-geek/emhass
          ref: ${{ env.QUALIFICATION_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Resolve each declared package and high-risk transitive package individually
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import datetime
          import pathlib
          import re
          import subprocess
          import tempfile
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          sources = [("runtime", x) for x in metadata["project"]["dependencies"]]
          for extra, values in metadata["project"]["optional-dependencies"].items():
              sources.extend((extra, x) for x in values)
          for group, values in metadata.get("dependency-groups", {}).items():
              sources.extend(("group-" + group, x) for x in values if x != "emhass")

          transitive = [
              "clarabel", "osqp", "scs", "sparsediffpy", "scikit-learn",
              "numexpr", "blosc2", "yarl", "multidict", "hatchling",
              "pip", "setuptools", "wheel", "cython", "cffi",
          ]
          sources.extend(("transitive-or-build", x) for x in transitive)
          seen = set()
          rows = []
          for group, req in sources:
              if req.casefold() in seen:
                  continue
              seen.add(req.casefold())
              with tempfile.NamedTemporaryFile(mode="w", suffix=".txt") as fp:
                  fp.write(req + "\n")
                  fp.flush()
                  cmd = [
                      "uv", "pip", "compile", fp.name, "--python-version", "3.15",
                      "--only-binary", ":all:", "--quiet",
                  ]
                  try:
                      result = subprocess.run(cmd, capture_output=True, text=True, timeout=55)
                      raw = (result.stderr + "\n" + result.stdout)
                      status = "BINARY_RESOLVED" if result.returncode == 0 else "BINARY_BLOCKED"
                      reason_lines = [
                          x.strip() for x in raw.splitlines()
                          if "cause:" in x or "error:" in x or "no usable wheels" in x
                      ]
                      reason = " | ".join(reason_lines)[:500]
                  except subprocess.TimeoutExpired:
                      status, reason = "TIMEOUT", "55-second per-dependency timeout"
                  rows.append({
                      "group": group, "requirement": req, "status": status,
                      "reason": reason, "checked_utc": datetime.datetime.now(
                          datetime.timezone.utc).isoformat(),
                  })
                  print("PROBE_RESULT|" + group + "|" + req + "|" + status +
                        "|" + reason, flush=True)

          with open("python315-per-package-linux-amd64.csv", "w", newline="") as fd:
              writer = csv.DictWriter(fd, fieldnames=list(rows[0]))
              writer.writeheader()
              writer.writerows(rows)
          print("PROBE_COUNT=" + str(len(rows)), flush=True)
          print("PROBE_BLOCKED=" + str(sum(
              r["status"] != "BINARY_RESOLVED" for r in rows)), flush=True)
          PY
      - name: Upload per-package attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python315-per-package-linux-amd64
          path: python315-per-package-linux-amd64.csv
          if-no-files-found: warn
