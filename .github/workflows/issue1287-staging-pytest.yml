name: Issue 1287 focused staging pytest

on:
  pull_request:
    branches:
      - stage/issue1287-base-20261118

permissions:
  contents: read

jobs:
  copenhagen-hourly-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install EMHASS and test dependencies
        run: uv sync --python "3.12" --extra test
      - name: Copenhagen hourly Open-Meteo publish regression
        run: uv run --python "3.12" pytest -q tests/dst_1189/test_pv_chain.py -k issue1287
